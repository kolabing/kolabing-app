# Build and upload to TestFlight from CI, so a release does not need one
# particular laptop (kolabing-app#159).
#
# DISABLED BY DEFAULT: it only runs on a deliberate tag or a manual dispatch.
# Two things to weigh before relying on it — macOS runner minutes cost about ten
# times Linux ones, and a repository secret holding an App Store key is a
# credential in one more place. The local `make beta-dev` needs neither.
#
# Secrets required:
#   ASC_KEY_ID          the App Store Connect key id
#   ASC_ISSUER_ID       the issuer id from the same page
#   ASC_KEY_P8_BASE64   base64 -i AuthKey_XXXXXXXXXX.p8
name: iOS → TestFlight

on:
  push:
    tags:
      - 'ios-beta-*'
      - 'ios-release-*'
  workflow_dispatch:
    inputs:
      environment:
        description: Which backend the build should talk to
        required: true
        default: prod
        type: choice
        options: [dev, prod]

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "::error::ASC_KEY_ID / ASC_KEY_P8_BASE64 are not set. See docs/release/ios-release-automation.md"
            exit 1
          fi
          # Outside the workspace: a key inside it can end up in an artefact.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: flutter pub get
        run: flutter pub get

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # A tag decides the environment; a manual run is asked.
          case "${GITHUB_REF_NAME}" in
            ios-beta-*)    ENV_NAME=dev ;;
            ios-release-*) ENV_NAME=prod ;;
            *)             ENV_NAME="${{ github.event.inputs.environment }}" ;;
          esac
          echo "Building for ${ENV_NAME}"

          export ASC_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ./scripts/release-ios.sh "$ENV_NAME"

      - name: Always remove the key
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"*.p8
