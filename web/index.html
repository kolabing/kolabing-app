<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kolabing — where businesses and communities collaborate on events, offers and sponsorships.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kolabing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=1.6.0">

  <!-- Favicon (cache-busted ?v= so browsers refetch the K logomark) -->
  <link rel="icon" type="image/png" href="favicon.png?v=1.6.0"/>

  <title>Kolabing</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Boot screen. The page used to sit blank while the Flutter bundle downloaded;
    now it paints the same thing the native app does on launch — the K filling
    up on the icon's own pure black — so web and app open the same way.

    Straight waterline rather than the app's wavy one: a 3px wave is CSS-only
    guesswork here and invisible at this size anyway. It fills and drains on a
    loop because nobody knows how long the bundle will take, exactly like the
    app's splash, and it goes away on Flutter's first frame.
  -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 300ms ease;
    }
    #boot.boot--gone { opacity: 0; pointer-events: none; }
    .boot-mark { position: relative; width: 132px; height: 128px; }
    .boot-mark img { display: block; width: 100%; height: 100%; }
    /* The empty vessel: present enough to read as the letter, dim enough that
       the fill line is the thing you watch. */
    .boot-mark__empty { opacity: 0.22; }
    .boot-mark__full {
      position: absolute;
      inset: 0;
      clip-path: inset(100% 0 0 0);
      animation: boot-fill 1900ms cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }
    @keyframes boot-fill {
      from { clip-path: inset(100% 0 0 0); }
      to   { clip-path: inset(0 0 0 0); }
    }
    .boot-word {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 6px;
      color: #FFE28C;
    }
    /* Reduced motion: show the finished mark, no fill. */
    @media (prefers-reduced-motion: reduce) {
      .boot-mark__full { animation: none; clip-path: inset(0 0 0 0); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-mark">
      <img class="boot-mark__empty" src="brand/kolabing-k-mark.png?v=1.6.0" alt="" width="657" height="636">
      <img class="boot-mark__full" src="brand/kolabing-k-mark.png?v=1.6.0" alt="" width="657" height="636">
    </div>
    <div class="boot-word">KOLABING</div>
  </div>

  <script>
    // Flutter fires this on window once it has painted; anything later would
    // leave the boot screen covering a live app.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('boot--gone');
      boot.addEventListener('transitionend', function () { boot.remove(); }, { once: true });
      // Belt and braces: if the transition never fires (tab backgrounded), the
      // boot screen still has to go.
      window.setTimeout(function () { if (boot.parentNode) boot.remove(); }, 800);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
