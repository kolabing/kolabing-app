name: kolabing_app
description: "Kolabing - Collaboration marketplace connecting businesses and communities"
publish_to: 'none'

version: 1.5.1+38

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Localization (en, es, ca) — official gen-l10n + Material/Cupertino delegates
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.2.0

  # Navigation
  go_router: ^17.0.1

  # UI Components
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0

  # Forms
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0

  # Image Picker
  image_picker: ^1.0.7

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # Auth
  google_sign_in: ^6.2.1

  # HTTP
  http: ^1.2.0

  # Firebase
  firebase_core: ^3.9.0
  firebase_messaging: ^15.2.4
  firebase_crashlytics: ^4.3.0

  # Error & performance monitoring (kolabing-mobile Sentry project)
  sentry_flutter: ^9.22.0

  # Local notifications (for foreground display on iOS)
  flutter_local_notifications: ^18.0.1

  # OneSignal push + in-app messaging
  onesignal_flutter: ^5.5.4

  # Apple Sign In
  sign_in_with_apple: ^7.0.1

  # In-App Purchase (iOS subscription)
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.4.8+1

  # Utils
  intl: any
  url_launcher: ^6.2.2
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  package_info_plus: ^8.1.3

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0

  # Gamification / Rewards
  share_plus: ^10.1.4
  confetti: ^0.8.0
  posthog_flutter: ^5.26.0
  dart_pusher_channels: ^1.3.1

# -----------------------------------------------------------------------------
# App Store validation blocker (#160)
#
# Apple refused the upload:
#
#   Invalid executable. The "Runner.app/Frameworks/objective_c.framework/
#   objective_c" executable references an unsupported platform in the arm64
#   slice. Simulator platforms aren't permitted.
#
# `path_provider_foundation` 2.6.0 moved from Swift/pigeon to FFI and pulled in
# `objective_c`, which Flutter builds through the NATIVE ASSETS pipeline
# (`code_assets` / `hooks` / `native_toolchain_c`) rather than CocoaPods — the
# only framework in this app built that way.
#
# What is VERIFIED: pinning to 2.5.1, the last version with no `objective_c`
# dependency, removes that framework from the archive entirely. Checked — the
# rebuilt Runner.app has 48 frameworks and none of them is the one Apple named.
#
# What is NOT verified: exactly why that binary was invalid. It carried only the
# legacy `LC_VERSION_MIN_IPHONEOS` marker, but so do all ten bundled OneSignal
# frameworks, and those have shipped — so the legacy marker alone is not the
# rejection. The likelier culprit is the native-assets build emitting a slice for
# the wrong platform, possibly contaminated by an earlier
# `flutter build ios --simulator` in the same tree. The offending artefact was
# overwritten by the clean rebuild, so that stays a hypothesis rather than a
# finding.
#
# Either way the pin removes the whole class, and path_provider is TRANSITIVE
# here — nothing in this app calls it directly — so the only cost is the newer
# plugin's internals.
#
# The same package is also why an iOS 17.5 simulator could not launch the app at
# all ("Failed to load dynamic library 'objective_c.framework/objective_c'"). One
# dependency, two symptoms.
#
# Remove this override once a Flutter release bundles native-asset frameworks
# cleanly, and re-check with `make beta-dry` before trusting it.
# -----------------------------------------------------------------------------
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/kolabing-wordmark-yellow-bg.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFD861"

flutter:
  uses-material-design: true

  # Generate AppLocalizations from lib/l10n/*.arb (see l10n.yaml)
  generate: true

  assets:
    - assets/images/
    - assets/images/defaults/
    - assets/brand/
    - assets/icons/
    - assets/icons/categories/
    - assets/icons/ui/a/
    - assets/icons/ui/b/
