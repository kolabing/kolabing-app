<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Wallet body -->
  <rect x="6" y="18" width="52" height="36" rx="5" fill="#FFE28C" stroke="#0D0D0D" stroke-width="2.5"/>
  <!-- Top strap -->
  <rect x="6" y="18" width="52" height="10" rx="5" fill="#0D0D0D" stroke="#0D0D0D" stroke-width="2.5"/>
  <!-- Card flap -->
  <path d="M6 28h52" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Coin pocket (purple) -->
  <rect x="36" y="36" width="18" height="12" rx="3" fill="#7F77DD" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Coin -->
  <circle cx="45" cy="42" r="4" fill="#FFE28C" stroke="#0D0D0D" stroke-width="1.5"/>
  <!-- Card lines -->
  <line x1="12" y1="38" x2="28" y2="38" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="44" x2="22" y2="44" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round"/>
</svg>
