<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Calendar body -->
  <rect x="8" y="16" width="48" height="42" rx="4" fill="white" stroke="#0D0D0D" stroke-width="2.5"/>
  <!-- Header bar (yellow) -->
  <rect x="8" y="16" width="48" height="12" rx="4" fill="#FFE28C" stroke="#0D0D0D" stroke-width="2.5"/>
  <line x1="8" y1="28" x2="56" y2="28" stroke="#0D0D0D" stroke-width="2"/>
  <!-- Binding hooks -->
  <line x1="20" y1="10" x2="20" y2="22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="10" x2="44" y2="22" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Date highlight (purple pill) -->
  <circle cx="32" cy="36" r="6" fill="#7F77DD"/>
  <circle cx="32" cy="36" r="2" fill="white"/>
  <!-- Other dots -->
  <circle cx="20" cy="36" r="2" fill="#0D0D0D"/>
  <circle cx="44" cy="36" r="2" fill="#0D0D0D"/>
  <circle cx="20" cy="46" r="2" fill="#0D0D0D"/>
  <circle cx="44" cy="46" r="2" fill="#0D0D0D"/>
</svg>
