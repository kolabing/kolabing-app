  <!-- Coin -->
  <circle cx="45" cy="42" r="4" stroke="#0D0D0D" stroke-width="1.5"/>
  <!-- Card lines -->
  <line x1="12" y1="38" x2="28" y2="38" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="44" x2="22" y2="44" stroke="#0D0D0D" stroke-width="1.5" stroke-linecap="round"/>
</svg>
