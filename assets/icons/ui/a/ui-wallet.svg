<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Wallet body -->
  <rect x="6" y="18" width="52" height="36" rx="5" stroke="#0D0D0D" stroke-width="2.5"/>
  <!-- Card flap -->
  <path d="M6 30h52" stroke="#0D0D0D" stroke-width="2"/>
